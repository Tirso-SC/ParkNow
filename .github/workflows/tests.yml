name: Ejecutar tests con Maven

on:
  push:
    branches: [ "develop", "production", "main" ]
  pull_request:
    branches: [ "develop", "production", "main" ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'corretto'
          cache: maven

      - name: Ejecutar tests
        run: mvn test